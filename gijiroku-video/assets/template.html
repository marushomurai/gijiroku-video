<title>会議名 議事録</title>
<style>
  :root {
    --page: #f4f6f9;
    --paper: #ffffff;
    --ink: #0b1220;
    --muted: #64748b;
    --blue: #1d4ed8;
    --blue-2: #2563eb;
    --tint: #dbeafe;
    --gray: #dbe1ea;
    --green: #00ab0f;
    --white: #ffffff;
    --jp: "ヒラギノ角ゴ Pro", "Hiragino Kaku Gothic Pro", "Hiragino Sans", "Noto Sans CJK JP", "Yu Gothic", system-ui, sans-serif;
    --num: "Helvetica Neue", Helvetica, Arial, var(--jp);
  }
  body { background: var(--page); color: var(--ink); font-family: var(--jp); }
  .bar { background: var(--blue); color: var(--white); padding-inline: 16px; }
  .bar img { height: 24px; width: auto; display: block; }
  .bar-in { max-width: 1080px; margin: 0 auto; padding-block: 14px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .bar-sub { font-size: 13px; opacity: .92; }
  .wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: start; }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }

  .player { width: min(100%, calc((100vh - 170px) * 9 / 16)); min-width: 300px; max-width: 100%; }
  @media (max-width: 820px) { .player { width: 100%; min-width: 0; } }
  .stage { display: block; width: 100%; aspect-ratio: 9 / 16; background: var(--paper); border: 2px solid var(--ink); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .controls button { font: 700 14px var(--jp); background: var(--white); color: var(--ink); border: 2px solid var(--ink); border-radius: 0; height: 40px; min-width: 44px; padding-inline: 12px; cursor: pointer; white-space: nowrap; }
  .controls button.main { background: var(--blue); color: var(--white); border-color: var(--blue); min-width: 96px; }
  .controls button:focus-visible, .chapters button:focus-visible, .segs button:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  .tc { margin-left: auto; white-space: nowrap; font: 500 13px var(--num); color: var(--muted); font-variant-numeric: tabular-nums; }
  .segs { display: flex; gap: 4px; margin-top: 10px; }
  .segs button { flex: 1; height: 8px; padding: 0; border: 0; background: var(--gray); cursor: pointer; position: relative; }
  .segs button i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--blue); }

  .side h1 { font-size: 22px; font-weight: 900; line-height: 1.4; margin: 0 0 4px; text-wrap: balance; }
  .side .lead { color: var(--muted); font-size: 14px; line-height: 1.7; margin: 0 0 16px; }
  .chapters { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .chapters button { width: 100%; text-align: left; display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; background: var(--white); border: 2px solid transparent; border-radius: 0; padding: 10px 12px; cursor: pointer; font: inherit; color: inherit; }
  .chapters button[aria-current="true"] { border-color: var(--blue); }
  .chapters .no { font: 700 13px var(--num); color: var(--blue); padding-top: 2px; }
  .chapters b { display: block; font-size: 15px; line-height: 1.5; }
  .chapters span { display: block; font-size: 13px; line-height: 1.7; color: var(--muted); font-variant-numeric: tabular-nums; }
  .src { margin-top: 16px; font-size: 12px; line-height: 1.7; color: var(--muted); }

  /* SVG text roles */
  .stage { fill: var(--ink); }
  .t { font-family: var(--jp); }
  .n { font-family: var(--num); font-weight: 700; }
  .h { font-family: var(--jp); font-weight: 700; }
  .scene { display: none; }
  .scene.on { display: inline; }

  /* element-level motion: only while a scene plays, so every frame is complete at rest */
  .play .pop  { animation: pop .55s cubic-bezier(.2,.9,.3,1.35) both; animation-delay: var(--d, 0s); transform-box: fill-box; transform-origin: center; }
  .play .fade { animation: fade .6s ease-out both; animation-delay: var(--d, 0s); }
  .play .gy   { animation: gy .9s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0s); transform-box: fill-box; transform-origin: bottom; }
  .play .gyd  { animation: gy .9s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0s); transform-box: fill-box; transform-origin: top; }
  .play .gx   { animation: gx .9s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0s); transform-box: fill-box; transform-origin: left; }
  .play .draw { stroke-dasharray: 1; animation: draw .9s ease-in-out both; animation-delay: var(--d, 0s); }
  .play .stamp{ animation: stamp .45s cubic-bezier(.3,1.4,.5,1) both; animation-delay: var(--d, 0s); transform-box: fill-box; transform-origin: center; }
  .play .spin { animation: spin 2.4s linear infinite; transform-box: fill-box; transform-origin: center; }
  .paused .stage * { animation-play-state: paused !important; }
  @keyframes pop  { from { opacity: 0; transform: scale(.6); } }
  @keyframes fade { from { opacity: 0; transform: translateY(24px); } }
  @keyframes gy   { from { transform: scaleY(0); } }
  @keyframes gx   { from { transform: scaleX(0); } }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes stamp{ from { opacity: 0; transform: scale(2.2) rotate(-8deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .play * { animation: none !important; } }
  .stage-box { position: relative; }
  .start { position: absolute; left: 50%; bottom: 3.5%; transform: translateX(-50%); white-space: nowrap; font: 700 16px var(--jp); background: var(--blue); color: var(--white); border: 2px solid var(--white); border-radius: 999px; padding: 14px 26px; cursor: pointer;  }
  .start:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
</style>

    const g = el('g', { class: 'pop' });
    g.append(
      el('polygon', { points: '20,95 80,95 80,172 20,172 42,133', fill: '#dbeafe', stroke: '#0b1220', 'stroke-width': 3, 'stroke-linejoin': 'round' }),
      el('polygon', { points: '700,95 640,95 640,172 700,172 678,133', fill: '#dbeafe', stroke: '#0b1220', 'stroke-width': 3, 'stroke-linejoin': 'round' }),
      el('rect', { x: 60, y: 70, width: 600, height: 88, fill: '#ffffff', stroke: '#0b1220', 'stroke-width': 3 })
    );
    const t = el('text', { x: 360, y: 128, 'text-anchor': 'middle', 'font-size': 34, 'font-weight': 900, class: 't' });
    t.textContent = s.dataset.title;
    g.append(t);
    s.prepend(g);
  });

  const segs = document.getElementById('segs');
  const fills = scenes.map((s, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', `場面${i + 1}: ${s.dataset.title}`);
    const f = document.createElement('i');
    b.append(f);
    b.onclick = () => go(i, true);
    segs.append(b);
    return f;
  });
  const chapters = [...document.querySelectorAll('#chapters button')];
  chapters.forEach((b, i) => b.onclick = () => go(i, true));

  // narration: the browser reads each scene's data-say aloud (no files, no API key)
  const tts = window.speechSynthesis;
  let soundOn = !!tts, speaking = false, voice = null;
  const pickVoice = () => {
    const vs = tts ? tts.getVoices().filter(v => /^ja/i.test(v.lang)) : [];
    voice = vs.find(v => /Kyoko|O-ren|Google|Nanami|Haruka/i.test(v.name)) || vs[0] || null;
  };
  if (tts) { pickVoice(); tts.onvoiceschanged = pickVoice; }
  const say = () => {
    if (!tts) return;
    tts.cancel(); tts.resume(); speaking = false;
    const text = scenes[cur].dataset.say;
    if (!playing || !soundOn || !text) return;
    // one utterance per sentence: Chrome cuts off long utterances
    const parts = text.split(/(?<=[。！？])/).filter(s => s.trim());
    parts.forEach((s, k) => {
      const u = new SpeechSynthesisUtterance(s);
      u.lang = 'ja-JP'; u.rate = 1.05; if (voice) u.voice = voice;
      if (k === parts.length - 1) u.onend = u.onerror = () => { if (u === current) speaking = false; };
      current = u;
      tts.speak(u);
    });
    speaking = true;
  };
  let current = null;
  const toggle = document.getElementById('toggle');
  const start = document.getElementById('start');
  const sound = document.getElementById('sound');
  if (!tts) { sound.textContent = '読み上げ非対応'; sound.disabled = true; }
  const tc = document.getElementById('tc');
  let cur = 0, playing = false, acc = 0, t0 = performance.now();
  const pad = n => String(n).padStart(2, '0');
  const clock = ms => `${pad(Math.floor(ms / 60000))}:${pad(Math.floor(ms / 1000) % 60)}`;

  function go(i, play) {
    cur = (i + scenes.length) % scenes.length;
    scenes.forEach((s, k) => { s.classList.toggle('on', k === cur); s.classList.remove('play'); });
    void svg.getBoundingClientRect();
    scenes[cur].classList.add('play');
    acc = 0; t0 = performance.now();
    start.hidden = true;
    if (play !== undefined) setPlaying(play); else say();
    chapters.forEach((b, k) => b.setAttribute('aria-current', k === cur));
  }
  function setPlaying(p) {
    if (p && !playing) t0 = performance.now() - acc;
    playing = p;
    root.classList.toggle('paused', !p);
    toggle.textContent = p ? '一時停止' : '再生';
    if (p) { if (tts && tts.paused) tts.resume(); else if (!speaking) say(); } else if (tts) tts.pause();
  }
  function tick(now) {
    if (playing) acc = now - t0;
    const done = durs.slice(0, cur).reduce((a, b) => a + b, 0);
    fills.forEach((f, k) => f.style.width = k < cur ? '100%' : k > cur ? '0%' : Math.min(100, acc / durs[cur] * 100) + '%');
    tc.textContent = `${pad(cur + 1)}/${pad(scenes.length)} · ${clock(done + Math.min(acc, durs[cur]))} / ${clock(total)}`;
    // wait for the voice to finish, but never more than twice data-dur (some browsers never fire onend)
    if (playing && acc >= durs[cur] && (!(soundOn && speaking) || acc >= durs[cur] * 2)) {
      if (cur < scenes.length - 1) go(cur + 1); else setPlaying(false);
    }
    requestAnimationFrame(tick);
  }
  toggle.onclick = () => {
    if (!start.hidden) return go(0, true);
    if (!playing && cur === scenes.length - 1 && acc >= durs[cur]) return go(0, true);
    setPlaying(!playing);
  };
  start.onclick = () => go(0, true);
  sound.onclick = () => {
    soundOn = !soundOn;
    sound.textContent = soundOn ? '音声オン' : '音声オフ';
    sound.setAttribute('aria-pressed', soundOn);
    if (soundOn) say(); else if (tts) { tts.cancel(); speaking = false; }
  };
  document.getElementById('prev').onclick = () => go(cur - 1, true);
  document.getElementById('next').onclick = () => go(cur + 1, true);
  document.addEventListener('keydown', e => {
    if (e.target.closest('button')) return;
    if (e.key === 'ArrowRight') go(cur + 1, true);
    else if (e.key === 'ArrowLeft') go(cur - 1, true);
    else if (e.key === ' ') { e.preventDefault(); toggle.click(); }
  });
  chapters[0].setAttribute('aria-current', true);
  root.classList.add('paused');
  requestAnimationFrame(tick);
})();
</script>
